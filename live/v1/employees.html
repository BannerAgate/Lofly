<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lofly — Medewerkers</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/lofly.css?v=2">
  <style>
    .date-filter-label { font-size:12px;font-weight:600;color:#6b7280;display:block;margin-bottom:3px; }
    .dept-section { margin-bottom:24px; }
    .dept-label {
      display:flex;align-items:center;gap:10px;
      margin-bottom:8px;
    }
    .dept-label-text {
      font-size:13px;font-weight:700;color:#1a2335;letter-spacing:0.02em;text-transform:uppercase;
    }
    .dept-label-count {
      font-size:11px;font-weight:600;color:#9ca3af;background:#f3f4f6;
      padding:2px 8px;border-radius:99px;
    }
    .dept-label-line { flex:1; height:1px; background:#f0f0f0; }
  </style>
</head>
<body>

<div class="app-layout" id="appLayout" style="display:none">
  <div id="sidebarContainer"></div>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Medewerkers</h1>
        <p class="page-subtitle" id="orgName"></p>
      </div>
      <button class="btn btn-primary" id="addEmpBtn" onclick="openAddModal()">+ Medewerker toevoegen</button>
    </div>

    <!-- Datumfilter -->
    <div style="display:flex;gap:10px;margin-bottom:20px;align-items:flex-end;flex-wrap:wrap">
      <div>
        <label class="date-filter-label" for="dateFrom">Van</label>
        <input type="date" class="form-control" id="dateFrom" style="width:150px" onchange="applyFilters()">
      </div>
      <div>
        <label class="date-filter-label" for="dateTo">Tot en met</label>
        <input type="date" class="form-control" id="dateTo" style="width:150px" onchange="applyFilters()">
      </div>
      <button class="btn btn-secondary btn-sm" onclick="clearDateFilter()" style="margin-bottom:1px">Wis filter</button>
    </div>

    <!-- Medewerkers gegroepeerd per afdeling -->
    <div id="employeesList">
      <div style="color:#9ca3af;font-size:13px;padding:20px 0">Laden...</div>
    </div>
  </main>
</div>

<!-- Add/Edit Employee Modal -->
<div class="modal-backdrop hidden" id="employeeModal">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Medewerker toevoegen</h2>
      <button class="modal-close" onclick="closeEmpModal()">✕</button>
    </div>

    <div class="form-group">
      <label class="form-label">Naam *</label>
      <input class="form-control" id="empName" type="text" placeholder="Jan Jansen" required>
    </div>
    <div class="form-group">
      <label class="form-label">Functietitel</label>
      <input class="form-control" id="empFunction" type="text" placeholder="Monteur">
    </div>
    <div class="form-group">
      <label class="form-label">Afdeling</label>
      <select class="form-control" id="empDepartment">
        <option value="">— Geen afdeling —</option>
      </select>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeEmpModal()">Annuleren</button>
      <button class="btn btn-primary" onclick="saveEmployee()" id="saveEmpBtn">Opslaan</button>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-backdrop hidden" id="deleteModal">
  <div class="modal" style="max-width:400px">
    <div class="modal-header">
      <h2 class="modal-title">Medewerker verwijderen</h2>
      <button class="modal-close" onclick="closeDeleteModal()">✕</button>
    </div>
    <p style="color:#6b7280;font-size:13.5px">Weet je zeker dat je <strong id="deleteName"></strong> wilt verwijderen? QR-scans en gekoppelde reviews blijven bewaard.</p>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeDeleteModal()">Annuleren</button>
      <button class="btn btn-danger" onclick="confirmDelete()">Verwijderen</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=3"></script>
<script>
let profile = null;
let employees = [];
let departments = [];
let reviews = [];
let scans = [];
let editingId = null;
let deletingId = null;

(async () => {
  const user = await requireAuth('index.html');
  if (!user) return;
  profile = await getCurrentProfile();
  if (!profile) { signOut(); return; }
  document.getElementById('orgName').textContent = profile.organizations?.name || '';
  document.getElementById('appLayout').style.display = 'flex';
  document.getElementById('sidebarContainer').innerHTML = renderNav('employees', profile);
  if (!isAdmin(profile)) {
    document.getElementById('addEmpBtn').style.display = 'none';
  }
  await loadData();
})();

async function loadData() {
  const [empRes, revRes, scanRes, orgRes] = await Promise.all([
    getSupabase().from('employees').select('*').order('name'),
    getSupabase().from('reviews').select('id, employee_id, star_rating, review_date'),
    getSupabase().from('qr_scans').select('id, employee_id, button_clicked, scanned_at'),
    getSupabase().from('organizations').select('departments').eq('id', profile.organization_id).single()
  ]);

  employees = empRes.data || [];
  reviews = revRes.data || [];
  scans = scanRes.data || [];
  departments = orgRes.data?.departments || [];

  applyFilters();
}

function applyFilters() {
  const dateFrom = document.getElementById('dateFrom').value;
  const dateTo = document.getElementById('dateTo').value;

  const filteredScans = scans.filter(s => {
    const d = s.scanned_at ? s.scanned_at.slice(0, 10) : null;
    if (!d) return true;
    if (dateFrom && d < dateFrom) return false;
    if (dateTo && d > dateTo) return false;
    return true;
  });

  const filteredReviews = reviews.filter(r => {
    const d = r.review_date ? r.review_date.slice(0, 10) : null;
    if (!d) return true;
    if (dateFrom && d < dateFrom) return false;
    if (dateTo && d > dateTo) return false;
    return true;
  });

  renderEmployees(filteredScans, filteredReviews);
}

function clearDateFilter() {
  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value = '';
  applyFilters();
}

function empRowHtml(emp, filteredScans, filteredReviews) {
  const empScans = filteredScans.filter(s => s.employee_id === emp.id);
  const empClicks = empScans.filter(s => s.button_clicked).length;
  const empRevs = filteredReviews.filter(r => r.employee_id === emp.id);
  const empAvg = empRevs.length
    ? (empRevs.reduce((a, r) => a + r.star_rating, 0) / empRevs.length).toFixed(1)
    : '—';
  const qrUrl = `https://loflyapp.com/redirect.html?qr=${emp.qr_code_id}`;
  return `
    <tr>
      <td><a href="employee.html?id=${emp.id}" style="color:#1a2335;font-weight:600">${escHtml(emp.name)}</a></td>
      <td style="color:#6b7280">${escHtml(emp.function_title || '—')}</td>
      <td>
        <div style="display:flex;align-items:center;gap:8px">
          <code style="font-size:11px;color:#6b7280;background:#f3f4f6;padding:2px 6px;border-radius:4px">${emp.qr_code_id ? emp.qr_code_id.substring(0,12) + '...' : '—'}</code>
          ${emp.qr_code_id ? `<button class="btn btn-icon" title="Kopieer QR URL" onclick="copyQR('${qrUrl}')">⎘</button>` : ''}
        </div>
      </td>
      <td>${empScans.length}</td>
      <td>${empClicks}</td>
      <td>${empRevs.length}</td>
      <td>${empAvg !== '—' ? empAvg + ' ★' : '—'}</td>
      <td style="display:flex;gap:6px">
        <a href="employee.html?id=${emp.id}" class="btn btn-secondary btn-sm">Detail</a>
        ${isAdmin(profile) ? `<button class="btn btn-secondary btn-sm" onclick="openEditModal('${emp.id}')">✎</button>` : ''}
        ${isAdmin(profile) ? `<button class="btn btn-danger btn-sm" onclick="openDeleteModal('${emp.id}')">✕</button>` : ''}
      </td>
    </tr>`;
}

function deptTableHtml(group, filteredScans, filteredReviews) {
  return `
    <div class="card" style="padding:0;overflow:hidden">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Naam</th><th>Functie</th><th>QR Code</th>
              <th>Scans</th><th>Klikken</th><th>Reviews</th><th>Gem. ★</th><th></th>
            </tr>
          </thead>
          <tbody>
            ${group.map(emp => empRowHtml(emp, filteredScans, filteredReviews)).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

function renderEmployees(filteredScans = scans, filteredReviews = reviews) {
  const container = document.getElementById('employeesList');
  if (!employees.length) {
    container.innerHTML = `
      <div class="card">
        <div class="empty-state">
          <div class="empty-state-icon">👤</div>
          <div class="empty-state-title">Nog geen medewerkers</div>
          <div class="empty-state-sub">Voeg medewerkers toe om QR-codes te genereren.</div>
        </div>
      </div>`;
    return;
  }

  // Groepeer per afdeling
  const grouped = {};
  const noDept = [];

  employees.forEach(emp => {
    if (emp.department && emp.department.trim()) {
      if (!grouped[emp.department]) grouped[emp.department] = [];
      grouped[emp.department].push(emp);
    } else {
      noDept.push(emp);
    }
  });

  // Toon afdelingen in volgorde zoals ze in de org staan
  const orderedDepts = departments.filter(d => grouped[d]);
  // Afdelingen die medewerkers hebben maar niet in de dept-lijst staan
  Object.keys(grouped).filter(d => !departments.includes(d)).forEach(d => orderedDepts.push(d));

  let html = '';

  orderedDepts.forEach(dept => {
    const group = grouped[dept];
    html += `
      <div class="dept-section">
        <div class="dept-label">
          <span class="dept-label-text">${escHtml(dept)}</span>
          <span class="dept-label-count">${group.length}</span>
          <span class="dept-label-line"></span>
        </div>
        ${deptTableHtml(group, filteredScans, filteredReviews)}
      </div>`;
  });

  if (noDept.length) {
    const label = orderedDepts.length ? 'Geen afdeling' : '';
    html += `
      <div class="dept-section">
        ${label ? `<div class="dept-label"><span class="dept-label-text">${label}</span><span class="dept-label-count">${noDept.length}</span><span class="dept-label-line"></span></div>` : ''}
        ${deptTableHtml(noDept, filteredScans, filteredReviews)}
      </div>`;
  }

  container.innerHTML = html;
}

async function copyQR(url) {
  await navigator.clipboard.writeText(url);
  showToast('QR URL gekopieerd!');
}

// ============================================================
// Add / Edit modal
// ============================================================
function populateDeptSelect(selectedDept) {
  const sel = document.getElementById('empDepartment');
  sel.innerHTML = '<option value="">— Geen afdeling —</option>' +
    departments.map(d => `<option value="${escHtml(d)}" ${d === selectedDept ? 'selected' : ''}>${escHtml(d)}</option>`).join('');
}

function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Medewerker toevoegen';
  document.getElementById('empName').value = '';
  document.getElementById('empFunction').value = '';
  populateDeptSelect('');
  document.getElementById('employeeModal').classList.remove('hidden');
}

function openEditModal(id) {
  const emp = employees.find(e => e.id === id);
  if (!emp) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = 'Medewerker bewerken';
  document.getElementById('empName').value = emp.name;
  document.getElementById('empFunction').value = emp.function_title || '';
  populateDeptSelect(emp.department || '');
  document.getElementById('employeeModal').classList.remove('hidden');
}

function closeEmpModal() {
  document.getElementById('employeeModal').classList.add('hidden');
  editingId = null;
}

async function saveEmployee() {
  const name = document.getElementById('empName').value.trim();
  const fn = document.getElementById('empFunction').value.trim();
  const dept = document.getElementById('empDepartment').value;
  if (!name) { showToast('Naam is verplicht', 'error'); return; }

  document.getElementById('saveEmpBtn').disabled = true;

  let error;
  if (editingId) {
    ({ error } = await getSupabase()
      .from('employees')
      .update({ name, function_title: fn || null, department: dept || null })
      .eq('id', editingId));
  } else {
    ({ error } = await getSupabase()
      .from('employees')
      .insert({ name, function_title: fn || null, department: dept || null, organization_id: profile.organization_id }));
  }

  document.getElementById('saveEmpBtn').disabled = false;
  if (error) { showToast('Fout: ' + error.message, 'error'); return; }
  showToast(editingId ? 'Medewerker bijgewerkt' : 'Medewerker toegevoegd');
  closeEmpModal();
  await loadData();
}

// ============================================================
// Delete
// ============================================================
function openDeleteModal(id) {
  const emp = employees.find(e => e.id === id);
  deletingId = id;
  document.getElementById('deleteName').textContent = emp?.name || '';
  document.getElementById('deleteModal').classList.remove('hidden');
}

function closeDeleteModal() {
  document.getElementById('deleteModal').classList.add('hidden');
  deletingId = null;
}

async function confirmDelete() {
  if (!deletingId) return;
  const { error } = await getSupabase().from('employees').delete().eq('id', deletingId);
  if (error) { showToast('Fout: ' + error.message, 'error'); return; }
  showToast('Medewerker verwijderd');
  closeDeleteModal();
  await loadData();
}
</script>
</body>
</html>
